<a class="skip" href="#contenido">Saltar al contenido</a>
<header class="site-header">
  <div class="shell top">
    <nav aria-label="Explorar">
      <a routerLink="/perros" routerLinkActive="actual" ariaCurrentWhenActive="page">Conoce a los perros</a>
    </nav>
    <a class="brand" routerLink="/">Adopta Patitas</a>
    <nav class="account-links" aria-label="Cuenta">
      @if (sesion.usuario()) {
        <a routerLink="/cuenta" routerLinkActive="actual" ariaCurrentWhenActive="page">Mi cuenta</a>
        <button type="button" class="text-button" [disabled]="saliendo()" (click)="salir()">Salir</button>
      } @else {
        <a routerLink="/entrar" routerLinkActive="actual" ariaCurrentWhenActive="page">Iniciar sesión</a>
      }
    </nav>
  </div>
</header>
@if (aviso()) { <p class="shell error" role="alert">{{ aviso() }}</p> }
<main id="contenido" tabindex="-1"><router-outlet /></main>
<footer>
  <div class="shell footer">
    <strong>Adopta Patitas</strong>
    <a routerLink="/perros">Perros en adopción</a>
    <a routerLink="/cuenta">Mi cuenta</a>
  </div>
</footer>
